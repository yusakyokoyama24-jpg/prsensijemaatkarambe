<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="100" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.3"/>
  
  <!-- Church building silhouette roof -->
  <path d="M 256 90 L 130 220 L 170 220 L 170 410 L 342 410 L 342 220 L 382 220 Z" fill="#1e3a8a" opacity="0.65" />
  
  <!-- Outer glowing sanctuary arch -->
  <path d="M 180 410 L 180 300 Q 256 220 332 300 L 332 410 Z" fill="#0f172a" stroke="url(#gold)" stroke-width="6" opacity="0.9" />

  <!-- Holy Cross in vibrant gold -->
  <!-- Vertical beam -->
  <rect x="242" y="140" width="28" height="190" rx="6" fill="url(#gold)" filter="url(#glow)"/>
  <!-- Horizontal beam -->
  <rect x="196" y="195" width="120" height="28" rx="6" fill="url(#gold)" filter="url(#glow)"/>

  <!-- GPS location pin radar pulse underneath -->
  <circle cx="256" cy="385" r="18" fill="none" stroke="url(#gold)" stroke-width="4" opacity="0.8"/>
  <circle cx="256" cy="385" r="7" fill="url(#gold)"/>

  <!-- Text / Badge -->
  <text x="256" y="460" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="3">PRESENSI GEREJA</text>
</svg>
